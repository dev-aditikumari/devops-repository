name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d notes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci-only-password@localhost:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (includes PostgreSQL integration tests)
        run: npm run test:ci
      - run: npm run build
      - name: API tests with Newman
        run: npm run test:api
        env:
          DATABASE_URL: ""
